document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3505c25b-7e74-45ba-8433-f20b53ab41cc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#f6f5f2;color:#1c2430;font-family:'Work Sans',sans-serif;}\na{color:#26374a;text-decoration:underline;}\na:hover{color:#1c2430;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#f6f5f2;min-height:100vh;padding:40px 24px;box-sizing:border-box\">\n<div style=\"max-width:1280px;margin:0 auto\">\n\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:16px\">\n    <div>\n      <div style=\"font-family:'Sora',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.01em\">Production Plan Impact &amp; Recovery<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px;background:#ffffff;border:1px solid #e4e1da;border-radius:10px;padding:4px\">\n      <sc-for list=\"{{ facilityOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n        <button style=\"padding:8px 16px;border-radius:8px;border:none;font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;background:{{ opt.bg }};color:{{ opt.color }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px\">\n    <div style=\"display:flex;gap:4px;background:#ffffff;border:1px solid #e4e1da;border-radius:10px;padding:4px\">\n      <sc-for list=\"{{ yearOptions }}\" as=\"yr\" hint-placeholder-count=\"2\">\n        <button style=\"padding:6px 14px;border-radius:8px;border:none;font-family:'Work Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;background:{{ yr.bg }};color:{{ yr.color }}\" sc-camel-on-click=\"{{ yr.onClick }}\">{{ yr.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px;background:#ffffff;border:1px solid #e4e1da;border-radius:10px;padding:4px\">\n      <sc-for list=\"{{ periodTypeOptions }}\" as=\"pt\" hint-placeholder-count=\"3\">\n        <button style=\"padding:6px 14px;border-radius:8px;border:none;font-family:'Work Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;background:{{ pt.bg }};color:{{ pt.color }}\" sc-camel-on-click=\"{{ pt.onClick }}\">{{ pt.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ periodValueOptions }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;gap:4px;background:#ffffff;border:1px solid #e4e1da;border-radius:10px;padding:4px;flex-wrap:wrap\">\n        <sc-for list=\"{{ periodValueOptions }}\" as=\"pv\" hint-placeholder-count=\"4\">\n          <button style=\"padding:6px 12px;border-radius:8px;border:none;font-family:'Work Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;background:{{ pv.bg }};color:{{ pv.color }}\" sc-camel-on-click=\"{{ pv.onClick }}\">{{ pv.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"font-size:13px;color:#6b7280\">{{ periodLabel }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:32px\">\n    <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n      <div style=\"background:{{ k.bg }};border:1px solid #e4e1da;border-radius:12px;padding:20px\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:{{ k.labelColor }}\">{{ k.label }}<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-size:28px;font-weight:700;margin-top:10px;color:{{ k.valueColor }}\">{{ k.value }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:{{ k.subColor }};margin-top:8px;line-height:1.4\">{{ k.sub }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #e4e1da;border-radius:12px;padding:24px 24px 16px;margin-bottom:28px\">\n    <div style=\"font-family:'Sora',sans-serif;font-size:16px;font-weight:700\">Weekly Impact Trend — {{ facilityLabel }}<\u002Fdiv>\n    <div style=\"font-size:13px;color:#6b7280;margin:4px 0 16px\">Impacted Qty per week. Red-ringed weeks crossed the impact threshold — hover for numbers, click a point to inspect the week below.<\u002Fdiv>\n    <div style=\"position:relative;width:100%;aspect-ratio:900/260\">\n      <svg sc-camel-view-box=\"0 0 900 260\" width=\"100%\" height=\"100%\" style=\"display:block;overflow:visible\">\n        <line x1=\"50\" y1=\"210\" x2=\"880\" y2=\"210\" stroke=\"#e4e1da\" stroke-width=\"1\"><\u002Fline>\n        <polygon points=\"{{ areaPoints }}\" fill=\"#26374a\" opacity=\"0.08\"><\u002Fpolygon>\n        <polyline points=\"{{ points }}\" fill=\"none\" stroke=\"#26374a\" stroke-width=\"2.5\"><\u002Fpolyline>\n        <sc-for list=\"{{ chartRows }}\" as=\"r\" hint-placeholder-count=\"39\">\n          <circle cx=\"{{ r.cx }}\" cy=\"{{ r.cy }}\" r=\"4\" fill=\"#26374a\" style=\"cursor:pointer\" sc-camel-on-mouse-enter=\"{{ r.onEnter }}\" sc-camel-on-mouse-leave=\"{{ r.onLeave }}\" sc-camel-on-click=\"{{ r.onClick }}\"><\u002Fcircle>\n          <sc-if value=\"{{ r.showTick }}\">\n            <text x=\"{{ r.cx }}\" y=\"228\" font-size=\"10\" fill=\"#9ca3af\" text-anchor=\"middle\" font-family=\"Work Sans\">{{ r.week }}<\u002Ftext>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ peakRows }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <circle cx=\"{{ p.cx }}\" cy=\"{{ p.cy }}\" r=\"9\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"2\"><\u002Fcircle>\n          <text x=\"{{ p.cx }}\" y=\"{{ p.labelY }}\" font-size=\"11\" font-weight=\"700\" fill=\"#c0392b\" text-anchor=\"middle\" font-family=\"Sora\">{{ p.labelPct }}<\u002Ftext>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ selectedMarker }}\" hint-placeholder-val=\"{{ false }}\">\n          <circle cx=\"{{ selectedMarker.cx }}\" cy=\"{{ selectedMarker.cy }}\" r=\"7\" fill=\"none\" stroke=\"#237a4a\" stroke-width=\"3\"><\u002Fcircle>\n        <\u002Fsc-if>\n      <\u002Fsvg>\n      <sc-if value=\"{{ hoverTooltip }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:{{ hoverTooltip.leftPct }}%;top:{{ hoverTooltip.topPct }}%;transform:translate(-50%,-115%);background:#1c2430;color:#fff;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.5;white-space:nowrap;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,0.18);z-index:5\">\n          <div style=\"font-weight:700;margin-bottom:2px\">{{ hoverTooltip.title }}<\u002Fdiv>\n          <div>{{ hoverTooltip.plan }}<\u002Fdiv>\n          <div>{{ hoverTooltip.impacted }}<\u002Fdiv>\n          <div>{{ hoverTooltip.empty }}<\u002Fdiv>\n          <div>{{ hoverTooltip.af }}<\u002Fdiv>\n          <div>{{ hoverTooltip.fd }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ selDetail }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:#1c2430;border-radius:12px;padding:24px;color:#fff;margin-bottom:28px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px\">\n        <div style=\"font-family:'Sora',sans-serif;font-size:16px;font-weight:700\">{{ selDetail.title }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#9aa5b3\">Click any point above to inspect a different week<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:18px\">\n        <sc-for list=\"{{ selDetail.fields }}\" as=\"fld\" hint-placeholder-count=\"6\">\n          <div>\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:#9aa5b3\">{{ fld.label }}<\u002Fdiv>\n            <div style=\"font-family:'Sora',sans-serif;font-size:18px;font-weight:700;margin-top:4px\">{{ fld.value }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ selDetail.sub }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.12)\">\n          <sc-for list=\"{{ selDetail.sub }}\" as=\"s\" hint-placeholder-count=\"2\">\n            <div style=\"background:rgba(255,255,255,0.06);border-radius:8px;padding:14px\">\n              <div style=\"font-size:12px;font-weight:700;color:#9aa5b3;margin-bottom:8px\">{{ s.name }}<\u002Fdiv>\n              <div style=\"font-size:13px;line-height:1.7\">{{ s.plan }}<br>{{ s.impacted }}<br>{{ s.empty }}<br>{{ s.af }}<br>{{ s.fd }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"background:#fff;border:1px solid #e4e1da;border-radius:12px;padding:24px;margin-bottom:28px\">\n    <div style=\"font-family:'Sora',sans-serif;font-size:16px;font-weight:700\">Recovery Funnel — {{ facilityLabel }}<\u002Fdiv>\n    <div style=\"font-size:13px;color:#6b7280;margin:4px 0 20px\">How PC, Operations and Planning narrowed the impact: total plan, down to what got hit, down to what's still unresolved.<\u002Fdiv>\n    <sc-for list=\"{{ funnelBars }}\" as=\"f\" hint-placeholder-count=\"3\">\n      <div style=\"margin-bottom:14px\">\n        <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px\">\n          <span style=\"font-weight:600\">{{ f.label }}<\u002Fspan>\n          <span style=\"color:#6b7280\">{{ f.valueStr }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#f1efe9;border-radius:6px;height:18px;overflow:hidden\">\n          <div style=\"height:100%;border-radius:6px;width:{{ f.widthPct }}%;background:{{ f.color }}\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"font-size:12px;color:#6b7280;margin-top:4px\">Recovered via air freight: {{ recoveredStr }} — the gap PC closed between \"impacted\" and \"still empty.\"<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #e4e1da;border-radius:12px;padding:24px;margin-bottom:28px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px\">\n      <div>\n        <div style=\"font-family:'Sora',sans-serif;font-size:16px;font-weight:700\">AF Cost vs. Empty-Plan Cost — {{ facilityLabel }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:#6b7280;margin-top:4px\">{{ periodLabel }} · AF Cost (navy) vs. Before Empty Plan Cost (red), impacted weeks only.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#237a4a\">Net Savings<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-size:22px;font-weight:700;color:#237a4a\">{{ savingsStr }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:flex-end;gap:18px;height:160px;margin-top:24px;padding-bottom:2px;border-bottom:1px solid #e4e1da;overflow-x:auto\">\n      <sc-for list=\"{{ costBars }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;min-width:52px\">\n          <div style=\"display:flex;align-items:flex-end;gap:4px;heigh v2 = raw.JV2.map(toRow);\n    const keys = ['planQty', 'impactedQty', 'afCost', 'beforeDelayQty', 'finalDelayQty', 'emptyImpact', 'beforeEmptyPlanCost', 'recoveredQty'];\n    const indo = jv.map((r, i) => {\n      const o = { ...r };\n      keys.forEach(k => { o[k] = r[k] + (jv2[i] ? jv2[i][k] : 0); });\n      o.impactedPct = o.planQty ? o.impactedQty / o.planQty : 0;\n      return o;\n    });\n    return { Indo: indo, JV: jv, JV2: jv2 };\n  }\n\n  setFacility(f) { this.setState({ facility: f }); }\n  setYear(y) { this.setState({ year: y, periodValue: null }); }\n  setPeriodType(t) { this.setState({ periodType: t, periodValue: null }); }\n  setPeriodValue(v) { this.setState({ periodValue: v }); }\n  selectWeek(idx) { this.setState({ selectedIdx: idx }); }\n  hoverWeek(idx) { this.setState({ hoverIdx: idx }); }\n  clearHover() { this.setState({ hoverIdx: null }); }\n\n  filterByPeriod(rows) {\n    const { periodType, periodValue } = this.state;\n    if (periodType === 'Year' || periodValue == null) return rows;\n    if (periodType === 'Quarter') return rows.filter(r => r.quarter === periodValue);\n    if (periodType === 'Month') return rows.filter(r => r.month === periodValue);\n    return rows;\n  }\n\n  fmtInt(n) { return Math.round(n).toLocaleString('en-US'); }\n  fmtK(n) {\n    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace(/\\.0$/, '') + 'M prs';\n    if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1).replace(/\\.0$/, '') + 'K prs';\n    return Math.round(n) + ' prs';\n  }\n  fmtMoney(n) { return '$' + Math.round(n).toLocaleString('en-US'); }\n  fmtPct(n) { return (n * 100).toFixed(0) + '%'; }\n\n  agg(rows) {\n    const sum = (k) => rows.reduce((a, r) => a + r[k], 0);\n    const planQty = sum('planQty'), impactedQty = sum('impactedQty'), emptyImpact = sum('emptyImpact'),\n      afCost = sum('afCost'), beforeEmptyPlanCost = sum('beforeEmptyPlanCost'), finalDelayQty = sum('finalDelayQty'),\n      recoveredQty = sum('recoveredQty');\n    return {\n      planQty, impactedQty, emptyImpact, afCost, beforeEmptyPlanCost, finalDelayQty, recoveredQty,\n      impactedPct: planQty ? impactedQty / planQty : 0, emptyPct: planQty ? emptyImpact / planQty : 0,\n      savings: beforeEmptyPlanCost - afCost,\n    };\n  }\n\n  renderVals() {\n    const facility = this.state.facility;\n    const year = this.state.year;\n    const byYear = (list) => list.filter(r => r.year === year);\n    const yearData = { Indo: byYear(this.data.Indo), JV: byYear(this.data.JV), JV2: byYear(this.data.JV2) };\n    const rows = this.filterByPeriod(yearData[facility]);\n    const totals = this.agg(rows);\n    const totalsAll = {\n      Indo: this.agg(this.filterByPeriod(yearData.Indo)),\n      JV: this.agg(this.filterByPeriod(yearData.JV)),\n      JV2: this.agg(this.filterByPeriod(yearData.JV2)),\n    };\n    const facilityLabel = facility === 'Indo' ? 'Indo (JV+JV2)' : facility;\n    const peakThreshold = this.props.peakThreshold ?? 0.15;\n\n    const { periodType, periodValue } = this.state;\n    const yearOptions = [2026, 2027].map(y => ({\n      key: y, label: String(y), bg: y === year ? '#26374a' : '#ffffff', color: y === year ? '#ffffff' : '#1c2430',\n      onClick: () => this.setYear(y),\n    }));\n    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n    const periodTypeOptions = ['Year', 'Quarter', 'Month'].map(t => ({\n      key: t, label: t, bg: t === periodType ? '#26374a' : '#ffffff', color: t === periodType ? '#ffffff' : '#1c2430',\n      onClick: () => this.setPeriodType(t),\n    }));\n    let periodValueOptions = null;\n    if (periodType === 'Quarter') {\n      periodValueOptions = [1, 2, 3, 4].map(q => ({\n        key: q, label: 'Q' + q, bg: periodValue === q ? '#26374a' : '#ffffff', color: periodValue === q ? '#ffffff' : '#1c2430',\n        onClick: () => this.setPeriodValue(q),\n      }));\n    } else if (periodType === 'Month') {\n      periodValueOptions = monthNames.map((m, i) => ({\n        key: i + 1, label: m, bg: periodValue === i + 1 ? '#26374a' : '#ffffff', color: periodValue === i + 1 ? '#ffffff' : '#1c2430',\n        onClick: () => this.setPeriodValue(i + 1),\n      }));\n    }\n    let periodLabel = rows.length ? year + ' full year' : year + ' — no data yet';\n    if (periodType === 'Quarter') periodLabel = periodValue ? 'Q' + periodValue + ' ' + year + ' (' + rows.length + ' weeks)' : 'Pick a quarter';\n    if (periodType === 'Month') periodLabel = periodValue ? monthNames[periodValue - 1] + ' ' + year + ' (' + rows.length + ' weeks)' : 'Pick a month';\n\n    const W = 900, H = 260, x0 = 50, x1 = 880, y0 = 20, y1 = 210;\n    const n = Math.max(rows.length, 1);\n    const xStep = n > 1 ? (x1 - x0) / (n - 1) : 0;\n    const maxImpacted = Math.max(1000, ...rows.map(r => r.impactedQty)) * 1.18;\n    const xOf = i => x0 + i * xStep;\n    const yOf = v => y1 - (v / maxImpacted) * (y1 - y0);\n\n    const chartRows = rows.map((r, pos) => {\n      const cx = xOf(pos), cy = yOf(r.impactedQty);\n      const isPeak = r.impactedPct >= peakThreshold;\n      return {\n        ...r, cx, cy, isPeak,\n        leftPct: (cx / W * 100), topPct: (cy / H * 100),\n        onClick: () => this.selectWeek(r.idx), onEnter: () => this.hoverWeek(r.idx), onLeave: () => this.clearHover(),\n        showTick: pos % 4 === 0 || n <= 8,\n      };\n    });\n    const points = chartRows.map(r => `${r.cx},${r.cy}`).join(' ');\n    const areaPoints = rows.length ? points + ` ${xOf(n - 1)},${y1} ${xOf(0)},${y1}` : '';\n    const peakRows = chartRows.filter(r => r.isPeak).map(r => ({ ...r, labelPct: this.fmtPct(r.impactedPct), labelY: r.cy - 14 }));\n    const hoverRow = this.state.hoverIdx != null ? chartRows.find(r => r.idx === this.state.hoverIdx) : null;\n    const hoverTooltip = hoverRow ? {\n      leftPct: hoverRow.leftPct, topPct: hoverRow.topPct,\n      title: hoverRow.week + ' · ' + hoverRow.dateLabel,\n      plan: 'Plan: ' + this.fmtInt(hoverRow.planQty),\n      impacted: 'Impacted: ' + this.fmtInt(hoverRow.impactedQty) + ' (' + this.fmtPct(hoverRow.impactedPct) + ')',\n      empty: 'Empty Impact: ' + this.fmtInt(hoverRow.emptyImpact),\n      af: 'AF Cost: ' + this.fmtMoney(hoverRow.afCost),\n      fd: 'Final Delay Qty: ' + this.fmtInt(hoverRow.finalDelayQty),\n    } : null;\n\n    const funnelMax = totals.planQty || 1;\n    const funnelBars = [\n      { label: 'Plan Qty', valueStr: this.fmtInt(totals.planQty) + ' prs', widthPct: 100, color: '#cbd1d9' },\n      { label: 'Impacted Qty', valueStr: this.fmtInt(totals.impactedQty) + ' prs (' + this.fmtPct(totals.impactedPct) + ')', widthPct: Math.max(2, totals.impactedQty / funnelMax * 100), color: '#3f5a7a' },\n      { label: 'Empty Impact (still unresolved)', valueStr: this.fmtInt(totals.emptyImpact) + ' prs (' + this.fmtPct(totals.emptyPct) + ')', widthPct: Math.max(2, totals.emptyImpact / funnelMax * 100), color: '#c0392b' },\n    ];\n    const recoveredStr = this.fmtInt(totals.recoveredQty) + ' prs';\n\n    const costRowsRaw = rows.filter(r => r.impactedQty > 0);\n    const costMax = Math.max(1, ...costRowsRaw.map(r => Math.max(r.afCost, r.beforeEmptyPlanCost)));\n    const costBars = costRowsRaw.map(r => ({\n      week: r.week,\n      afH: Math.max(2, r.afCost / costMax * 100),\n      beforeH: Math.max(2, r.beforeEmptyPlanCost / costMax * 100),\n      afTitle: r.week + ' AF Cost ' + this.fmtMoney(r.afCost),\n      beforeTitle: r.week + ' Empty-Plan Cost ' + this.fmtMoney(r.beforeEmptyPlanCost),\n    }));\n    const savingsStr = this.fmtMoney(totals.savings);\n\n    const facColors = { Indo: '#26374a', JV: '#2f6f8f', JV2: '#b8863b' };\n    const facilityBars = ['Indo', 'JV', 'JV2'].map(f => ({\n      key: f, name: f === 'Indo' ? 'Indo (JV+JV2)' : f,\n      pctStr: (totalsAll[f].impactedPct * 100).toFixed(1) + '%',\n      impactedStr: this.fmtInt(totalsAll[f].impactedQty), planStr: this.fmtInt(totalsAll[f].planQty),\n      emptyStr: this.fmtInt(totalsAll[f].emptyImpact), emptyPctStr: (totalsAll[f].emptyPct * 100).toFixed(1) + '%',\n      widthPct: Math.max(0.5, totalsAll[f].impactedPct * 100), labelLeft: Math.max(0.5, totalsAll[f].impactedPct * 100) + '%',\n      color: facColors[f], weight: f === facility ? '800' : '500',\n    }));\n\n    const facilityOptions = ['Indo', 'JV', 'JV2'].map(f => ({\n      key: f, label: f === 'Indo' ? 'Indo (JV+JV2)' : f,\n      bg: f === facility ? '#26374a' : '#ffffff', color: f === facility ? '#ffffff' : '#1c2430',\n      onClick: () => this.setFacility(f),\n    }));\n\n    const kpis = [\n      { label: 'Plan Qty', value: this.fmtK(totals.planQty), sub: this.fmtInt(totals.planQty) + ' prs planned', bg: '#ffffff', labelColor: '#6b7280', valueColor: '#1c2430', subColor: '#6b7280' },\n      { label: 'Impacted Qty', value: this.fmtK(totals.impactedQty) + ' (' + this.fmtPct(totals.impactedPct) + ')', sub: 'of plan hit by material issues', bg: '#ffffff', labelColor: '#6b7280', valueColor: '#1c2430', subColor: '#6b7280' },\n      { label: 'Empty Impact', value: this.fmtK(totals.emptyImpact), sub: this.fmtPct(totals.emptyPct) + ' of plan still unresolved', bg: '#ffffff', labelColor: '#6b7280', valueColor: '#c0392b', subColor: '#6b7280' },\n      { label: 'AF Cost Spent', value: this.fmtMoney(totals.afCost), sub: 'to recover ' + this.fmtInt(totals.recoveredQty) + ' prs', bg: '#ffffff', labelColor: '#6b7280', valueColor: '#1c2430', subColor: '#6b7280' },\n      { label: 'Cost Avoided', value: this.fmtMoney(totals.savings), sub: 'Empty-Plan Cost ' + this.fmtMoney(totals.beforeEmptyPlanCost) + ' − AF Cost', bg: '#26374a', labelColor: '#c9d3de', valueColor: '#ffffff', subColor: '#aebbc8' },\n      { label: 'Final Delay Qty', value: this.fmtK(totals.finalDelayQty), sub: 'shipped late after all recovery actions', bg: '#ffffff', labelColor: '#6b7280', valueColor: '#c0392b', subColor: '#6b7280' },\n    ];\n\n    let selDetail = null;\n    const peakRow = rows.reduce((m, r) => (!m || r.impactedQty > m.impactedQty ? r : m), null);\n    const selIdx = rows.some(r => r.idx === this.state.selectedIdx) ? this.state.selectedIdx : (peakRow ? peakRow.idx : null);\n    if (selIdx != null) {\n      const r = rows.find(rr => rr.idx === selIdx);\n      if (r) {\n        selDetail = {\n          title: r.week + ' (' + r.dateLabel + ') — ' + facilityLabel,\n          fields: [\n            { label: 'Plan Qty', value: this.fmtInt(r.planQty) },\n            { label: 'Impacted Qty', value: this.fmtInt(r.impactedQty) + ' (' + this.fmtPct(r.impactedPct) + ')' },\n            { label: 'Empty Impact', value: this.fmtInt(r.emptyImpact) },\n            { label: 'Recovered via AF', value: this.fmtInt(r.recoveredQty) },\n            { label: 'AF Cost', value: this.fmtMoney(r.afCost) },\n            { label: 'Final Delay Qty', value: this.fmtInt(r.finalDelayQty) },\n          ],\n          sub: null,\n        };\n        if (facility === 'Indo') {\n          const rj = yearData.JV.find(x => x.idx === r.idx);\n          const rj2 = yearData.JV2.find(x => x.idx === r.idx);\n          selDetail.sub = [\n            { name: 'JV', plan: 'Plan: ' + this.fmtInt(rj.planQty), impacted: 'Impacted: ' + this.fmtInt(rj.impactedQty) + ' (' + this.fmtPct(rj.impactedPct) + ')', empty: 'Empty: ' + this.fmtInt(rj.emptyImpact), af: 'AF Cost: ' + this.fmtMoney(rj.afCost), fd: 'Final Delay Qty: ' + this.fmtInt(rj.finalDelayQty) },\n            { name: 'JV2', plan: 'Plan: ' + this.fmtInt(rj2.planQty), impacted: 'Impacted: ' + this.fmtInt(rj2.impactedQty) + ' (' + this.fmtPct(rj2.impactedPct) + ')', empty: 'Empty: ' + this.fmtInt(rj2.emptyImpact), af: 'AF Cost: ' + this.fmtMoney(rj2.afCost), fd: 'Final Delay Qty: ' + this.fmtInt(rj2.finalDelayQty) },\n          ];\n        }\n      }\n    }\n\n    const selectedMarker = chartRows.find(r => r.idx === selIdx) || null;\n\n    return {\n      facilityLabel, facilityOptions, yearOptions, periodTypeOptions, periodValueOptions, periodLabel, kpis, chartRows, points, areaPoints, peakRows, hoverTooltip,\n      selectedMarker, funnelBars, recoveredStr, costBars, savingsStr, selDetail,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
